apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "securefin-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "securefin-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "securefin-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
